name: Deploy

# Deploys main after CI passes. Auth is keyless: GitHub's OIDC token is exchanged for
# short-lived Google credentials through Workload Identity Federation (infra/gcp-setup.sh).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE: darb-api
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  api:
    name: API to Cloud Run
    # Skips until infra/gcp-setup.sh has run and its output is saved as repository variables.
    if: >-
      vars.GCP_WIF_PROVIDER != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push image
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/darb/api:$SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$image" api
          docker push "$image"
      - name: Deploy service
        # Spending guardrails live here: at most 2 instances, CPU billed only during requests.
        # AI and Stripe test keys come from Secret Manager once infra/set-secrets.sh stored them.
        env:
          APP_SECRETS: ${{ vars.APP_SECRETS || vars.AI_SECRETS }}
        run: |
          secret_flags=()
          if [ -n "$APP_SECRETS" ]; then secret_flags=(--set-secrets "$APP_SECRETS"); fi
          app_url="https://$PROJECT_ID.web.app"
          runtime="darb-api@$PROJECT_ID.iam.gserviceaccount.com"
          env_vars="ENVIRONMENT=production,FIREBASE_PROJECT_ID=$PROJECT_ID,APP_VERSION=${SHA::7}"
          env_vars+=",APP_URL=$app_url,CLEANUP_INVOKER=$runtime"
          env_vars+=",CLEANUP_AUDIENCE=$app_url/api/internal/cleanup-demo-accounts"
          gcloud run deploy "$SERVICE" "${secret_flags[@]}" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/darb/api:$SHA" \
            --service-account "$runtime" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 40 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 60 \
            --set-env-vars "$env_vars" \
            --quiet

  web:
    name: Web, rules and indexes to Firebase
    needs: api
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.GCP_PROJECT_ID }}.firebaseapp.com
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - run: >-
          pnpm exec firebase deploy --only hosting,firestore
          --project "$PROJECT_ID" --non-interactive --message "${SHA::7}"
